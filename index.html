<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spacetime Sandbox</title>
<style>
:root {
  --bg: #06080c; --panel: rgba(10, 14, 20, 0.86); --line: rgba(140, 170, 200, 0.18);
  --line-strong: rgba(140, 170, 200, 0.4); --text: #d7e1ea; --dim: #8496a8; --faint: #55657a;
  --accent: #6fd3ff; --warm: #ffb454; --good: #7be0a4; --bad: #ff7a7a;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.wlabel { position: absolute; font: 11px var(--mono); color: var(--dim); white-space: nowrap; transform: translate(8px, -50%); text-shadow: 0 0 4px #000, 0 0 4px #000; }
.wlabel.strong { color: var(--text); }
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
#top { top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 14px; border-width: 0 0 1px 0; }
#top h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; white-space: nowrap; }
#top .station { color: var(--accent); font: 12px var(--mono); white-space: nowrap; }
#top .spacer { flex: 1; }
#consts { display: flex; gap: 18px; align-items: center; flex: none; }
.cdial { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--dim); flex: none; }
.cdial b { color: var(--text); font-weight: 500; width: 14px; text-align: center; font-style: italic; font-family: Georgia, serif; font-size: 14px; }
.cdial input { width: 90px; flex: none; }
.cdial output { min-width: 56px; color: var(--text); white-space: nowrap; flex: none; }
.cdial.off { opacity: 0.32; }
#left, #right { top: 44px; bottom: 86px; width: 300px; overflow-y: auto; padding: 12px 14px 20px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
#left { left: 0; border-width: 0 1px 0 0; }
#right { right: 0; border-width: 0 0 0 1px; width: 340px; }
#bottom { left: 0; right: 0; bottom: 0; height: 86px; border-width: 1px 0 0 0; }
#ruler { width: 100%; height: 100%; display: block; cursor: ew-resize; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
p.blurb { color: var(--dim); margin: 0 0 6px; font-size: 12.5px; }
p.note { color: var(--faint); margin: 6px 0; font-size: 11.5px; }
p.warn { color: var(--warm); margin: 6px 0; font-size: 11.5px; }
.dial { margin: 9px 0; }
.dial .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dial label { color: var(--dim); font-size: 12px; }
.dial output { font: 12px var(--mono); color: var(--text); text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 2px 0 0; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line-strong); }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 14px; margin-top: -6px; background: var(--accent); border: none; border-radius: 1px; cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 10px; height: 14px; background: var(--accent); border: none; border-radius: 1px; cursor: pointer; }
.readouts { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12px; }
.readouts dt { color: var(--dim); }
.readouts dd { margin: 0; font-family: var(--mono); text-align: right; color: var(--text); white-space: nowrap; }
.readouts dd.good { color: var(--good); } .readouts dd.bad { color: var(--bad); } .readouts dd.warm { color: var(--warm); }
button, select { font: 12px var(--sans); color: var(--text); background: rgba(255,255,255,0.03); border: 1px solid var(--line-strong); padding: 5px 10px; border-radius: 2px; cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
button.on { border-color: var(--accent); color: var(--accent); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.toggle { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--dim); cursor: pointer; }
.toggle input { accent-color: var(--accent); }
canvas.plot { width: 100%; display: block; margin: 6px 0 2px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); }
.plotcap { font-size: 11px; color: var(--faint); margin: 0 0 8px; }
#help, #challenges { top: 60px; left: 50%; transform: translateX(-50%); width: min(640px, 92vw); max-height: 78vh; overflow-y: auto; padding: 18px 22px; z-index: 5; }
#help kbd { font: 11px var(--mono); border: 1px solid var(--line-strong); padding: 1px 5px; border-radius: 2px; color: var(--text); }
#help table { border-collapse: collapse; width: 100%; } #help td { padding: 3px 8px 3px 0; vertical-align: top; color: var(--dim); }
.hidden { display: none !important; }
#fade { position: fixed; inset: 0; background: var(--bg); pointer-events: none; opacity: 0; transition: opacity 0.18s; }
.chal { border: 1px solid var(--line); padding: 10px 12px; margin: 8px 0; }
.chal.done { border-color: var(--good); }
.chal h4 { margin: 0 0 3px; font-size: 13px; } .chal p { margin: 0; color: var(--dim); font-size: 12px; }
.chal .st { float: right; font: 11px var(--mono); color: var(--faint); } .chal.done .st { color: var(--good); }
.chal button { margin-top: 6px; }
#toast { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); padding: 8px 16px; background: var(--panel); border: 1px solid var(--good); color: var(--good); font: 12px var(--mono); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 6; }
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 94px; padding: 3px 10px; background: rgba(6,8,12,0.7); font: 11px var(--mono); color: var(--dim); pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="top" class="panel">
  <h1>Spacetime Sandbox</h1>
  <span class="station" id="stationName"></span>
  <span class="spacer"></span>
  <div id="consts"></div>
  <button id="btnChallenges">Challenges</button>
  <button id="btnHelp">Help</button>
</div>
<div id="left" class="panel"></div>
<div id="right" class="panel"></div>
<div id="bottom" class="panel"><canvas id="ruler"></canvas></div>
<div id="hint"></div>
<div id="help" class="panel hidden"></div>
<div id="challenges" class="panel hidden"></div>
<div id="toast"></div>
<div id="fade"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
